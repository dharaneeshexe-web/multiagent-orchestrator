global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "multiagent-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"

  - job_name: "celery-flower"
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: "/metrics"

  - job_name: "prometheus-self"
    static_configs:
      - targets: ["localhost:9090"]
