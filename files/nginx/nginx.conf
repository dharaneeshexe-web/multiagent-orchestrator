upstream api_servers {
    server api:8000;
}

# ── Rate limiting (http context) ─────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=rag:10m rate=10r/s;

# ── Logging (http context) ───────────────────────────────────────────────────
log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status"'
'}';

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 256;

    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log warn;

    # ── Health ───────────────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://api_servers/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API (rate-limited) ───────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api_servers/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # ── RAG (stricter rate limit) ────────────────────────────────────────────
    location /rag/ {
        limit_req zone=rag burst=5 nodelay;
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── SSE streaming ────────────────────────────────────────────────────────
    location /stream {
        proxy_pass http://api_servers/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # ── WebSocket ────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://api_servers/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Metrics (internal only) ──────────────────────────────────────────────
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://api_servers/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Catch-all ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
