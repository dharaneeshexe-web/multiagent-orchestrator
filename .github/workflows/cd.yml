name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Kubernetes
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.32.0"

      - name: Set up kustomize
        run: |
          curl -sSLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tag in overlays
        run: |
          SHORT_SHA="${{ github.sha }}"
          cd k8s/overlays/prod
          kustomize edit set image multiagent-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}

      - name: Deploy to production
        run: |
          cd k8s/overlays/prod
          kustomize build | kubectl apply -f -

      - name: Verify rollout
        id: verify
        continue-on-error: true
        run: |
          kubectl rollout status deployment/api -n multiagent --timeout=180s
          kubectl rollout status deployment/worker -n multiagent --timeout=180s
          kubectl rollout status deployment/worker-dlq -n multiagent --timeout=120s

      - name: Rollback on failure
        if: steps.verify.outcome == 'failure'
        run: |
          kubectl rollout undo deployment/api -n multiagent
          kubectl rollout undo deployment/worker -n multiagent
          kubectl rollout undo deployment/worker-dlq -n multiagent
