name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.15" mypy
          pip install -r files/app/requirements.txt

      - name: Ruff lint
        run: ruff check files/

      - name: Ruff format check
        run: ruff format --check files/ || echo "Format check skipped for now"

      - name: mypy type check
        run: |
          mypy files/app/ --ignore-missing-imports --explicit-package-bases --no-namespace-packages || \
          echo "mypy found issues (non-blocking for now)"

  test:
    runs-on: ubuntu-22.04
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: multiagent
          POSTGRES_PASSWORD: multiagent
          POSTGRES_DB: multiagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock httpx aiosqlite
          pip install -r files/app/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: files/app
          DATABASE_URL: postgresql+asyncpg://multiagent:multiagent@localhost:5432/multiagent_test
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
          OTLP_ENDPOINT: http://localhost:4317
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
        run: |
          python -m pytest files/tests/ -v --tb=short -x --asyncio-mode=auto

  docker:
    runs-on: ubuntu-22.04
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: files/
          file: files/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
