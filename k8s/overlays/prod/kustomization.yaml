apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: multiagent

resources:
  - ../../base

images:
  - name: multiagent-api
    newName: ghcr.io/multiagent-orchestrator/multiagent-api
    newTag: v1.0.0

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
    target:
      kind: Deployment
      name: worker

labels:
  - pairs:
      environment: prod
    includeSelectors: false
