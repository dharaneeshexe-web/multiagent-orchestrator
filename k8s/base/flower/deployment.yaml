apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: multiagent
  labels:
    app: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      containers:
        - name: flower
          image: multiagent-api:latest
          envFrom:
            - configMapRef:
                name: multiagent-config
            - secretRef:
                name: multiagent-secrets
          command:
            - celery
            - -A
            - worker.celery_app
            - flower
            - --port=5555
            - --broker_api=redis://redis-service:6379/0
          ports:
            - containerPort: 5555
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: flower-service
  namespace: multiagent
spec:
  selector:
    app: flower
  ports:
    - port: 5555
      targetPort: 5555
  type: ClusterIP
