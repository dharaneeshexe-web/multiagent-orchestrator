apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect
  namespace: multiagent
  labels:
    app: prefect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect
  template:
    metadata:
      labels:
        app: prefect
    spec:
      containers:
        - name: prefect
          image: prefecthq/prefect:3-latest
          ports:
            - containerPort: 4200
          env:
            - name: PREFECT_SERVER_API_HOST
              value: "0.0.0.0"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: multiagent-secrets
                  key: POSTGRES_PASSWORD
            - name: PREFECT_API_DATABASE_CONNECTION_URL
              value: "postgresql+asyncpg://multiagent:$(POSTGRES_PASSWORD)@postgres-service:5432/multiagent"
          command: ["prefect", "server", "start", "--host", "0.0.0.0"]
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4200
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4200
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: prefect-service
  namespace: multiagent
spec:
  selector:
    app: prefect
  ports:
    - port: 4200
      targetPort: 4200
  type: ClusterIP
