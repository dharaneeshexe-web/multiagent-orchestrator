apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: multiagent
  labels:
    app: worker
    component: celery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: multiagent-api:latest
          envFrom:
            - configMapRef:
                name: multiagent-config
            - secretRef:
                name: multiagent-secrets
          command:
            - celery
            - -A
            - worker.celery_app
            - worker
            - --loglevel=info
            - --queues=default,priority
            - --concurrency=2
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - worker.celery_app
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: multiagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-dlq
  namespace: multiagent
  labels:
    app: worker-dlq
    component: celery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-dlq
  template:
    metadata:
      labels:
        app: worker-dlq
    spec:
      containers:
        - name: worker-dlq
          image: multiagent-api:latest
          envFrom:
            - configMapRef:
                name: multiagent-config
            - secretRef:
                name: multiagent-secrets
          command:
            - celery
            - -A
            - worker.celery_app
            - worker
            - --loglevel=warning
            - --queues=dead_letter
            - --concurrency=1
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
