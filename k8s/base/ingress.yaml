apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multiagent-ingress
  namespace: multiagent
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: api.multiagent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8000
    - host: grafana.multiagent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
    - host: jaeger.multiagent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-service
                port:
                  number: 16686
    - host: flower.multiagent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flower-service
                port:
                  number: 5555
    - host: prefect.multiagent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prefect-service
                port:
                  number: 4200
